# Keys supplied via Secret -> env vars (secretKeyRef).
apiVersion: v1
kind: Secret
metadata:
  name: llm-stats-exporter-keys
type: Opaque
stringData:
  openai-admin-key: sk-admin-REPLACE_ME
  anthropic-admin-key: sk-ant-admin-REPLACE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-stats-exporter
  labels:
    app.kubernetes.io/name: llm-stats-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-stats-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-stats-exporter
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: exporter
          image: ghcr.io/navinpai/llm-stats-exporter:latest
          ports:
            - name: metrics
              containerPort: 9184
          env:
            - name: OPENAI_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-stats-exporter-keys
                  key: openai-admin-key
                  optional: true
            - name: ANTHROPIC_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-stats-exporter-keys
                  key: anthropic-admin-key
                  optional: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: llm-stats-exporter
  labels:
    app.kubernetes.io/name: llm-stats-exporter
spec:
  selector:
    app.kubernetes.io/name: llm-stats-exporter
  ports:
    - name: metrics
      port: 9184
      targetPort: metrics
