# Keys supplied via Secret mounted as files + *_FILE env vars.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-stats-exporter
  labels:
    app.kubernetes.io/name: llm-stats-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-stats-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-stats-exporter
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: exporter
          image: ghcr.io/navinpai/llm-stats-exporter:latest
          ports:
            - name: metrics
              containerPort: 9184
          env:
            - name: OPENAI_ADMIN_KEY_FILE
              value: /secrets/openai-admin-key
            - name: ANTHROPIC_ADMIN_KEY_FILE
              value: /secrets/anthropic-admin-key
          volumeMounts:
            - name: keys
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: keys
          secret:
            secretName: llm-stats-exporter-keys
