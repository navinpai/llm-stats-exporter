[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[project]
name = "llm-stats-exporter"
version = "0.4.0"
description = "Prometheus exporter for LLM API usage and cost (OpenAI, Anthropic)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Navin Pai" }]
requires-python = ">=3.11"
keywords = ["prometheus", "exporter", "openai", "anthropic", "llm", "cost", "usage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "prometheus-client>=0.26.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/navinpai/llm-stats-exporter"
Issues = "https://github.com/navinpai/llm-stats-exporter/issues"

[project.scripts]
llm-stats-exporter = "llm_stats_exporter.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "responses>=0.26.3",
    "ruff>=0.16.5",
    "mypy>=2.3.1",
    "types-requests>=2.33.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "RET", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
