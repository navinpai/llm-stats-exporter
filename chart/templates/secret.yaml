{{- if and .Values.adminKeys (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-stats-exporter.fullname" . }}-keys
  labels:
    {{- include "llm-stats-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.adminKeys }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
