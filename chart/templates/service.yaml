apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-stats-exporter.fullname" . }}
  labels:
    {{- include "llm-stats-exporter.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "llm-stats-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: metrics
